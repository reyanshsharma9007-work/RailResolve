apiVersion: v1
kind: ConfigMap
metadata:
  name: railresolve-config
data:
  NODE_ENV: "production"
  PORT: "5000"
  FASTAPI_URL: "http://railresolve-fastapi:8000"
  MONGODB_URI: "mongodb://railresolve-mongo:27017/railresolve"
  JWT_EXPIRES_IN: "24h"
  BCRYPT_SALT_ROUNDS: "10"
  FASTAPI_REQUEST_TIMEOUT_MS: "8000"
  MAX_IMAGE_SIZE_BYTES: "5242880"
  MAX_DOCUMENT_SIZE_BYTES: "10485760"
  RATE_LIMIT_WINDOW_MS: "900000"
  AUTH_RATE_LIMIT_MAX: "10"
  COMPLAINT_RATE_LIMIT_MAX: "30"
  UPLOAD_RATE_LIMIT_MAX: "20"
  LOG_LEVEL: "info"

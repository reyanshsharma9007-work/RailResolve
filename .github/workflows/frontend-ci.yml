name: Frontend CI

on:
  push:
    branches:
      - vijay

  pull_request:
    branches:
      - vijay

jobs:
  frontend-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/code-quantum-frontend:latest .

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository_owner }}/code-quantum-frontend:latest

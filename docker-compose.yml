services:
  frontend:
    image: railresolve-frontend:latest
    ports:
      - "3002:80"
    depends_on:
      - backend

  backend:
    image: railresolve-backend:latest
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/railresolve
      FASTAPI_URL: http://fastapi:8000
      JWT_SECRET: railresolve_dev_jwt_secret_2026_do_not_use_in_prod
      JWT_EXPIRES_IN: 24h
      BCRYPT_SALT_ROUNDS: 10
      INTERNAL_SERVICE_TOKEN: railresolve_dev_internal_token_2026
      FASTAPI_REQUEST_TIMEOUT_MS: 8000
      CLIENT_ORIGIN: http://localhost:3002
      MAX_IMAGE_SIZE_BYTES: 5242880
      MAX_DOCUMENT_SIZE_BYTES: 10485760
      RATE_LIMIT_WINDOW_MS: 900000
      AUTH_RATE_LIMIT_MAX: 10
      COMPLAINT_RATE_LIMIT_MAX: 30
      UPLOAD_RATE_LIMIT_MAX: 20
      LOG_LEVEL: info
    depends_on:
      - mongo
      - fastapi

  fastapi:
    image: railresolve-fastapi:latest
    environment:
      PORT: 8000
      ENVIRONMENT: development
      INTERNAL_SERVICE_TOKEN: railresolve_dev_internal_token_2026
      LLM_BASE_URL: https://api.llm-provider.com/v1
      LLM_API_KEY: ""
      LLM_PRIMARY_MODEL: qwen3-32b
      LLM_FALLBACK_MODEL: mistral-small-24b
      LLM_TIMEOUT: 30
      ALLOWED_ORIGIN: http://localhost:5000
      LOG_LEVEL: INFO

  mongo:
    image: mongo:8
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:

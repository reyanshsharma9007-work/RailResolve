apiVersion: apps/v1
kind: Deployment
metadata:
  name: railresolve-express
spec:
  replicas: 1
  selector:
    matchLabels:
      app: railresolve-express
  template:
    metadata:
      labels:
        app: railresolve-express
    spec:
      containers:
        - name: express
          image: ghcr.io/reyanshsharma9007-work/railresolve-express:latest
          ports:
            - containerPort: 5000

          envFrom:
            - configMapRef:
                name: railresolve-config
            - secretRef:
                name: railresolve-secret

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: railresolve-express
spec:
  selector:
    app: railresolve-express
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
